<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2840 1400" width="2840" height="1400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="2840" height="1400" fill="#FFFFFF"/>
<text x="170" y="60" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="30" fill="#111" text-anchor="start" font-weight="bold" xml:space="preserve">GPIO Génesis · Boceto técnico v2 · CAPAS DE LA ESCENA (equivale a la sección transversal)</text>
<text x="170" y="96" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#555" text-anchor="start" font-weight="normal" xml:space="preserve">De abajo (se dibuja primero) hacia arriba. Cada capa es un nodo de Godot 4; la fábrica es la única pixelada.</text>
<rect x="452" y="180" width="1200" height="84" rx="10" fill="#F85149" fill-opacity="0.9" stroke="#111" stroke-width="1"/>
<text x="482" y="218" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">7 · Modales</text>
<text x="482" y="248" font-family="&#x27;JetBrains Mono&#x27;,&#x27;DejaVu Sans Mono&#x27;,monospace" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="normal" xml:space="preserve">CanvasLayer (layer 10)</text>
<text x="1692" y="220" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Pausa · banner crítico · fin de nivel</text>
<rect x="426" y="285" width="1200" height="84" rx="10" fill="#B5793A" fill-opacity="0.9" stroke="#111" stroke-width="1"/>
<text x="456" y="323" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">6 · Copiloto</text>
<text x="456" y="353" font-family="&#x27;JetBrains Mono&#x27;,&#x27;DejaVu Sans Mono&#x27;,monospace" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="normal" xml:space="preserve">CanvasLayer (layer 4)</text>
<text x="1666" y="325" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Panel, retrato 32×32, globo con streaming (RichTextLabel)</text>
<rect x="400" y="390" width="1200" height="84" rx="10" fill="#1F6FEB" fill-opacity="0.9" stroke="#111" stroke-width="1"/>
<text x="430" y="428" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">5 · Editor</text>
<text x="430" y="458" font-family="&#x27;JetBrains Mono&#x27;,&#x27;DejaVu Sans Mono&#x27;,monospace" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="normal" xml:space="preserve">CanvasLayer (layer 3)</text>
<text x="1640" y="430" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">CodeEdit + barra de botones · fuente nativa</text>
<rect x="374" y="495" width="1200" height="84" rx="10" fill="#238636" fill-opacity="0.9" stroke="#111" stroke-width="1"/>
<text x="404" y="533" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">4 · HUD</text>
<text x="404" y="563" font-family="&#x27;JetBrains Mono&#x27;,&#x27;DejaVu Sans Mono&#x27;,monospace" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="normal" xml:space="preserve">CanvasLayer (layer 2)</text>
<text x="1614" y="535" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Barra superior, objetivos, mini-trazas</text>
<rect x="348" y="600" width="1200" height="84" rx="10" fill="#3FB950" fill-opacity="0.9" stroke="#111" stroke-width="1"/>
<text x="378" y="638" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">3 · Etiquetas de pin</text>
<text x="378" y="668" font-family="&#x27;JetBrains Mono&#x27;,&#x27;DejaVu Sans Mono&#x27;,monospace" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="normal" xml:space="preserve">CanvasLayer (layer 1)</text>
<text x="1588" y="640" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Siguen la posición de cada máquina; texto nativo</text>
<rect x="322" y="705" width="1200" height="84" rx="10" fill="#8A94A6" fill-opacity="0.9" stroke="#111" stroke-width="1"/>
<text x="352" y="743" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">2 · Contenedor</text>
<text x="352" y="773" font-family="&#x27;JetBrains Mono&#x27;,&#x27;DejaVu Sans Mono&#x27;,monospace" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="normal" xml:space="preserve">SubViewportContainer</text>
<text x="1562" y="745" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Escala entera ×3 / ×2 · stretch, filtro nearest</text>
<rect x="296" y="810" width="1200" height="84" rx="10" fill="#5A6475" fill-opacity="0.9" stroke="#111" stroke-width="1"/>
<text x="326" y="848" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">1 · Fábrica</text>
<text x="326" y="878" font-family="&#x27;JetBrains Mono&#x27;,&#x27;DejaVu Sans Mono&#x27;,monospace" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="normal" xml:space="preserve">SubViewport (tamaño variable)</text>
<text x="1536" y="850" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Zona segura 384×240 + decorado · TileMapLayer · máquinas · luces como sprites aditivos</text>
<rect x="270" y="915" width="1200" height="84" rx="10" fill="#30363D" fill-opacity="0.9" stroke="#111" stroke-width="1"/>
<text x="300" y="953" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="26" fill="#FFFFFF" text-anchor="start" font-weight="bold" xml:space="preserve">0 · Fondo</text>
<text x="300" y="983" font-family="&#x27;JetBrains Mono&#x27;,&#x27;DejaVu Sans Mono&#x27;,monospace" font-size="19" fill="#FFFFFF" text-anchor="start" font-weight="normal" xml:space="preserve">ColorRect</text>
<text x="1510" y="955" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="18" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">Color #0E1117 (bordes de letterbox)</text>
<text x="170" y="1050" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="22" fill="#111" text-anchor="start" font-weight="bold" xml:space="preserve"></text>
<text x="170" y="1094" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="17" fill="#D6336C" text-anchor="start" font-weight="bold" xml:space="preserve">Decisiones de la sección</text>
<text x="204" y="1120" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">· Solo la capa 1 se pixela; el texto nunca, para que se lea en 1366×768.</text>
<text x="204" y="1142" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">· Luces cálidas como sprites con mezcla aditiva, no PointLight2D:</text>
<text x="204" y="1164" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">  cuidan los 30 fps con gráficos integrados (RD-02).</text>
<text x="204" y="1186" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">· Partículas con CPUParticles2D por la misma razón.</text>
<text x="170" y="1216" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="17" fill="#D6336C" text-anchor="start" font-weight="bold" xml:space="preserve">Cómo se agrega un nivel (&#x27;ensamble&#x27;)</text>
<text x="204" y="1242" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">nivel_XX.json = { máquinas: [{id, tipo, pin, modo, pos}],</text>
<text x="204" y="1264" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">objetivos: [...], plantilla_codigo, pistas_locales }</text>
<text x="204" y="1286" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">La escena del nivel solo cambia el TileMap y las máquinas;</text>
<text x="204" y="1308" font-family="&#x27;Inter&#x27;,&#x27;DejaVu Sans&#x27;,Arial,sans-serif" font-size="15" fill="#222" text-anchor="start" font-weight="normal" xml:space="preserve">HUD, editor, copiloto y etiquetas se reutilizan sin cambios.</text>
</svg>